[workspace]
resolver = "3"
members = ["common", "awg", "router", "nftables", "patches"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["slipmesh"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/slipmesh/talos-extensions"

[workspace.dependencies]
common = { path = "common" }
awg = { path = "awg" }
router = { path = "router" }
nftables = { path = "nftables" }

anyhow = "1.0.104"
clap = { version = "4.5.51", features = ["derive"] }
askama = { version = "0.16.0", default-features = false, features = ["derive", "alloc"] }
base64 = "0.23.1"
futures = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Comment/format-preserving YAML patch operations - part of zizmor (github.com/zizmorcore/zizmor),
# MIT. `patches`' rw-add/rw-del use this instead of a hand-rolled text scan to add/remove one
# roadwarriors client entry in mesh.yaml without disturbing the rest of that hand-edited file
# (comments, existing flow-style entries). Pinned to the latest stable (not the 1.30.0-rc1
# prerelease) since the two crates version in lockstep with each other, not with zizmor itself.
yamlpath = "1.29.0"
yamlpatch = "1.29.0"
yaml_serde = "0.10"
# QR code encoder - de-facto standard for this in Rust (18M+ downloads). Used by `rw-add`/
# `rw-inspect --qr` to print a scannable client config straight to the terminal.
qrcode = "0.14.1"

genetlink = "0.2.7"
# Pinned to a specific rev, not crates.io's 0.1.2: the amneziawg kernel module we build against
# (see talos-awg-extension's versions.env) speaks genl family version 3, which changed
# WGDEVICE_A_H1..H4 from a NUL-terminated
# decimal string to a packed u64 (per the kernel module's own src/netlink.c nla_policy
# table - .type = NLA_U64). crates.io's 0.1.2 still only emits/parses the
# old string form for those four attributes, which the current kernel module's nla_policy rejects
# outright with "attribute type 14 has an invalid length" - and would
# likely also break parsing GetDevice responses, since the kernel echoes H1 back as raw u64 bytes
# that are not valid UTF-8. This exact fix (H1Range/H2Range/H3Range/H4Range as packed u64) landed
# upstream the day before the kernel commit we're pinned to, but was never published to crates.io -
# see push_obfuscation_attrs in netlink/awg.rs for the call site. The rev is now the one that
# added AmneziaWG 3.1's WGDEVICE_A_RANDOM_TRAILERS and WGDEVICE_A_DISABLE_COOKIES; nothing is
# published to crates.io, so a rev is the only pin available.
netlink-packet-amnezia-wireguard = { git = "https://github.com/frkn-dev/netlink-packet-amnezia-wireguard", rev = "b8b5fcc75adbc0c63cac0a9b30fdecbe783efd6c" }
netlink-packet-core = "0.8.2"
netlink-packet-generic = "0.4.0"
rtnetlink = "0.21.0"
# Deliberately no direct `netlink-packet-route` dependency: rtnetlink re-exports its own pinned
# version as `rtnetlink::packet_route`, and importing route/link types through that path (not a
# separate top-level `netlink_packet_route` dependency) avoids two possibly-mismatched copies of
# the same types ending up in the dependency graph.
