[workspace]
resolver = "3"
members = ["common", "awg", "router", "nftables", "taloscfg"]

[workspace.package]
version = "1.15.0-alpha.2+sm.3"
edition = "2024"
authors = ["slipmesh"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/slipmesh/talos-extensions"
# Taken by git tag, never from crates.io.
publish = false

[workspace.dependencies]
# default-features = false throughout: the netlink-backed halves are opt-in, so `taloscfg` - which
# needs the config types alone - builds off Linux. The daemons re-enable them through their own
# `runtime` feature, which is on by default for each of them.
common = { path = "common", default-features = false }
awg = { path = "awg", default-features = false }
router = { path = "router", default-features = false }
nftables = { path = "nftables", default-features = false }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Templates read at runtime rather than compiled in: `builtins` for filters such as `join`,
# `serde` to render from the daemons' own context structs.
minijinja = { version = "3.1.0", default-features = false, features = ["builtins", "serde"] }
base64 = "0.23.1"
# Ours, from a release tag: sliplib is not published to crates.io.
sliplib-net = { git = "https://github.com/slipmesh/sliplib", tag = "v0.8.0" }
sliplib-runtime = { git = "https://github.com/slipmesh/sliplib", tag = "v0.6.0" }
sliplib-secrets = { git = "https://github.com/slipmesh/sliplib", tag = "v0.6.0" }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1" }
tracing = "0.1.44"

yaml_serde = "0.10.7"
# Lossless YAML editing: `taloscfg` writes what it mints, and the clients `rw-add` adds, into the
# hand-edited slipmesh.yaml through its typed overlays, which change only the lines they add and
# leave comments and layout as written.
yaml-rt = "0.3.3"
# QR code encoder - de-facto standard for this in Rust (18M+ downloads). Used by `rw-add`/
# `rw-inspect --qr` to print a scannable client config straight to the terminal.
qrcode = "0.14.1"

# The metrics endpoint's HTTP surface (`awg::metrics`). Not a new stack: `router`'s `reqwest`
# already pulls hyper/hyper-util/http-body-util into this workspace, so this only turns on hyper's
# `server` feature over crates that are already built and already audited here. One route, no TLS,
# no routing - but request-line parsing, malformed input and half-close are not worth re-deriving.
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
# Hyper's own body type; already in the lock graph via the same reqwest dependency.
bytes = "1.12.1"
# Prometheus exposition. Used by building a fresh `Registry` per scrape rather than through the
# `Collector` trait, whose `encode` is synchronous and so cannot host the async netlink dump the
# values come from - a per-scrape registry also means a peer removed from the config is simply
# never registered, with no state carried between scrapes. Brings escaping, HELP/TYPE, counter
# `_total` handling and family grouping, which is precisely what a hand-written encoder gets wrong.
prometheus-client = "0.25.2"
# `IP_FREEBIND` has no tokio API (see `awg::metrics::bind`), so the listening socket is configured
# through socket2 before `bind()`. Already in the lock graph at this version via tokio's own `net`
# feature - a manifest line, not a new crate.
socket2 = { version = "0.6.5", features = ["all"] }

genetlink = "0.3.1"
# Ours, from a release tag, not crates.io's netlink-packet-amnezia-wireguard 0.1.2: the amneziawg
# kernel module we build against (AWG_REF in talos-kernel's versions.env) speaks genl family
# version 3, which carries WGDEVICE_A_H1..H4 as packed u64 ranges, and 0.1.2 only knows the old
# NUL-terminated strings the module's nla_policy now rejects ("attribute type 14 has an invalid
# length"). It is built on netlink-packet-wireguard, so it follows the netlink-packet-* majors below.
netlink-packet-amneziawg = { git = "https://github.com/slipmesh/netlink-packet-amneziawg", tag = "v0.1.0" }
# These four move as one unit, and the amneziawg crate above is the fifth: its types implement
# `GenlFamily`/`Nla`/`Emitable` from *these* major versions, so a mismatch anywhere here stops the
# awg module compiling. It is also the only crate that speaks AmneziaWG's genl family
# ("amneziawg", version 3 - not mainline WireGuard's "wireguard", version 1), so it is what the
# other four have to agree with, in either direction.
netlink-packet-core = "0.9.0"
netlink-packet-generic = "0.5.0"
rtnetlink = "0.24.0"
# `kill(2)`, for passing SIGTERM on to `bird`: tokio can only SIGKILL a child. Already in the lock graph
# with `signal` on, via rtnetlink.
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
# Deliberately no direct `netlink-packet-route` dependency: rtnetlink re-exports its own pinned
# version as `rtnetlink::packet_route`, and importing route/link types through that path (not a
# separate top-level `netlink_packet_route` dependency) avoids two possibly-mismatched copies of
# the same types ending up in the dependency graph.
