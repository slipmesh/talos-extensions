# A release builds nothing: its binaries are copied out of the image the tagged commit already
# has, so what the release attaches is what the checks ran against.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    if: github.ref_type != 'tag'
    uses: slipmesh/.github/.github/workflows/rust.yml@v1.1
    with:
      binaries: awg router nftables slipmesh-taloscfg

  image:
    needs: rust
    if: github.ref_type != 'tag'
    uses: slipmesh/.github/.github/workflows/image.yml@v1.1
    permissions:
      contents: read
      packages: write

  tag:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: slipmesh/.github/.github/workflows/tag-release.yml@v1.1
    permissions:
      contents: write

  # Runs for a release commit tagged above, or for a tag pushed by hand.
  promote:
    needs: tag
    if: ${{ !cancelled() && (github.ref_type == 'tag' || needs.tag.outputs.tag != '') }}
    uses: slipmesh/.github/.github/workflows/promote.yml@v1.1
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.tag.outputs.tag }}

  release:
    needs: [tag, promote]
    if: ${{ !cancelled() && needs.promote.result == 'success' }}
    uses: slipmesh/.github/.github/workflows/release.yml@v1.1
    permissions:
      contents: write
      packages: read
    with:
      tag: ${{ needs.tag.outputs.tag }}
      image-ref: ${{ needs.promote.outputs.image-ref }}
      prepare: |
        mkdir dist
        for arch in amd64 arm64; do
          # A scratch image has no command; the placeholder only lets the container be created.
          id=$(docker create --platform "linux/$arch" "$IMAGE_REF" /none)
          for bin in awg router nftables slipmesh-taloscfg; do
            docker cp "$id:/usr/local/bin/$bin" "dist/$bin-linux-$arch"
          done
          docker rm "$id" >/dev/null
        done
        (cd dist && sha256sum -- * > SHA256SUMS)
      assets: >-
        dist/slipmesh-taloscfg-linux-amd64 dist/slipmesh-taloscfg-linux-arm64
        dist/awg-linux-amd64 dist/awg-linux-arm64
        dist/router-linux-amd64 dist/router-linux-arm64
        dist/nftables-linux-amd64 dist/nftables-linux-arm64
        dist/SHA256SUMS
