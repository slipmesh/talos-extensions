# Pull requests and pushes run the checks; only a merged release PR is built, in its own run, and
# released. The release attaches the same binaries its image carries, from the same build.
name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  # cargo audit depends on the advisory database, not on the commit.
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: slipmesh/.github/.github/workflows/rust.yml@v2.2

  release-commit:
    if: github.event_name == 'push'
    uses: slipmesh/.github/.github/workflows/release-commit.yml@v2.2

  build:
    needs: [release-commit, checks]
    if: needs.release-commit.outputs.version != ''
    uses: slipmesh/.github/.github/workflows/rust-build.yml@v2.2
    with:
      binaries: awg router nftables slipmesh-taloscfg

  image:
    needs: build
    uses: slipmesh/.github/.github/workflows/image.yml@v2.2
    permissions:
      contents: read
      packages: write

  promote:
    needs: [release-commit, image]
    uses: slipmesh/.github/.github/workflows/promote.yml@v2.2
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}

  tag:
    needs: [release-commit, promote]
    uses: slipmesh/.github/.github/workflows/tag-release.yml@v2.2
    permissions:
      contents: write
    with:
      version: ${{ needs.release-commit.outputs.version }}

  release:
    needs: [release-commit, tag]
    uses: slipmesh/.github/.github/workflows/release.yml@v2.2
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}
      latest: ${{ needs.release-commit.outputs.latest == 'true' }}
      prerelease: ${{ needs.release-commit.outputs.prerelease == 'true' }}
      download-binaries: true
      prepare: |
        mkdir dist
        for arch in amd64 arm64; do
          for bin in awg router nftables slipmesh-taloscfg; do
            cp "binaries/$arch/release/$bin" "dist/$bin-linux-$arch"
          done
        done
        (cd dist && sha256sum -- * > SHA256SUMS)
      assets: >-
        dist/slipmesh-taloscfg-linux-amd64 dist/slipmesh-taloscfg-linux-arm64
        dist/awg-linux-amd64 dist/awg-linux-arm64
        dist/router-linux-amd64 dist/router-linux-arm64
        dist/nftables-linux-amd64 dist/nftables-linux-arm64
        dist/SHA256SUMS
