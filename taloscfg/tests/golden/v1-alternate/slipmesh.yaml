# A network in format version 1 for the golden test beside it: what every node of this file gets
# is compared with the files of this directory, byte for byte, with derived public keys named by
# their owner.
#
# This is the other side of ../v1, the full fixture, for each key that a file sets once: other
# names for the interfaces and the route protocol, no tunnel networks, a mesh MTU set below the
# limit of the links, BFD off, and the keys that may be left out left out.
#
# Every network and address is from a range reserved for documentation; a node_id is an
# identity, not an address. Every name stands for nothing and every key is one letter repeated.

slipmesh:
  kind: network
cluster:
  bgp_as: 64501
  mesh_mtu: 1400
  interface_prefix:
    mesh: wg-
  route_proto_id:
    egress: 153
  loopback_networks:
    ipv4: 198.51.100.0/25
    ipv6: "3fff:0:0:1::/64"
  direct_interfaces: [lan0]
nodes:
  # The IPv4 loopback takes the low 7 bits of the id, the IPv6 one all 32.
  - name: east
    node_id: 198.51.100.133
    endpoint: "2001:db8::1"
    mesh_private_key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  - name: west
    node_id: 0.0.1.2
    mesh_private_key: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE=
  - name: south
    node_id: 0.0.0.3
    endpoint: 192.0.2.3
    mesh_private_key: IIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII=
mesh:
  links:
    - pair: [east, west]
      port: 51830
      obfuscation: {jc: 4, jmin: 40, jmax: 400, s1: 64, s2: 48, h1: 1101, h2: 2202, h3: 3303, h4: 4404}
    # Stock WireGuard: what it sets of its own does not reach it either.
    - pair: [west, south]
      port: 51831
      plain: true
      obfuscation: {jc: 5, s4: 32, h1: 11}
bypass:
  - node: west
    include:
      - kind: geoip
        country: ZZ
---
slipmesh:
  kind: roadwarriors
name: stock
node_hostnames: [east]
address: 198.18.0.1/24
listen_port: 51840
private_key: ggggggggggggggggggggggggggggggggggggggggggg=
plain: true
obfuscation: {jc: 6, s4: 48}
clients:
  - name: laptop
    public_key: ooooooooooooooooooooooooooooooooooooooooooo=
    allowed_ips: [198.18.0.2/32]
---
slipmesh:
  kind: patch
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: router
configFiles:
  - mountPath: /etc/talos-extensions/router.conf.j2
    content: |
      router id {{ loopback }};
      protocol device {
      }
---
# The ruleset, for one node alone: the others get none.
slipmesh:
  kind: patch
  include: [east]
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: nftables
configFiles:
  - mountPath: /etc/talos-extensions/nftables.conf.j2
    content: |
      table ip example_nat {
          chain postrouting {
              type nat hook postrouting priority srcnat; policy accept;
              oifname "{{ defaultroute_interface_ipv4 }}" masquerade
          }
      }
---
# Stands before the document for every node and is still merged over it: a null takes a key out,
# and a mapping inside is merged key by key.
slipmesh:
  kind: patch
  include: [west]
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: example
environment: null
settings:
  level: debug
  limits:
    burst: 20
---
slipmesh:
  kind: patch
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: example
environment:
  - EXAMPLE_LEVEL=info
settings:
  level: info
  limits:
    rate: 5
    burst: 10
