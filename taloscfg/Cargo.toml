[package]
name = "taloscfg"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline generator for Talos machine-config patches (awg mesh/roadwarriors, router BGP/OSPF, nftables) from a single slipmesh.yaml file - never touches a live node"

[[bin]]
name = "slipmesh-taloscfg"
path = "src/main.rs"

# The daemon crates come in for their config types only - `default-features = false` leaves the
# netlink-backed modules out, which is what lets this generator build off Linux.
[dependencies]
anyhow.workspace = true
awg.workspace = true
base64.workspace = true
clap.workspace = true
common.workspace = true
nftables.workspace = true
router.workspace = true
serde.workspace = true
sha2 = "0.11.0"
similar = "3.2.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
rand = "0.10.2"
yaml_serde.workspace = true
qrcode.workspace = true
anstream = "1.0.0"
anstyle = "1.0.14"
yaml-rt.workspace = true
atomic-write-file = "0.3.1"
