[package]
name = "taloscfg"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Offline generator for Talos machine-config patches (awg mesh/roadwarriors, router BGP/OSPF, nftables) from a single slipmesh.yaml file - never touches a live node"

[[bin]]
name = "slipmesh-taloscfg"
path = "src/main.rs"

# The daemon crates come in for their config types only - `default-features = false` leaves the
# netlink-backed modules out, which is what lets this generator build off Linux.
[dependencies]
anyhow.workspace = true
clap.workspace = true
nftables.workspace = true
router.workspace = true
serde.workspace = true
sliplib-config.workspace = true
sliplib-net.workspace = true
sliplib-secrets.workspace = true
sliplib-yaml.workspace = true
sha2 = "0.11.1"
similar = "3.2.1"
rand = "0.10.3"
qrcode.workspace = true
anstream = "1.0.0"
anstyle = "1.0.14"
