name: nftables
container:
  entrypoint: ./nftables
  security:
    writeableRootfs: false
    writeableSysfs: false
depends:
  - configuration: true
# Not a oneshot, despite applying a static ruleset: something else's first nftables/iptables-nft
# bootstrap around kubelet/kube-proxy startup can
# wipe our tables in a one-time boot race (which side wins depends on scheduling, not anything in
# our control - see nftables.rs's own doc comment for the full story). `restart: always` +
# main.rs's `nft monitor`-driven watchdog loop reapplies whenever that happens, the same strategy
# Talos's own NfTablesChainController uses for its own table. Talos still restarts the whole
# container fresh on any ExtensionServiceConfig change (`handleRestart()`, independent of
# `restart:`), so editing `ruleset:` and re-applying the machine config reruns this from scratch.
restart: always
logToConsole: true
