name: router
container:
  entrypoint: ./router
  # This extension's rootfs (variant: scratch) ships with no CA trust store of its own - the
  # RIPEstat bypass resolver (reqwest) needs one to make any HTTPS request. Bind-mounting the
  # host's own store (Talos maintains it for containerd/kubelet) means it's always current
  # with whatever Talos ships, no separate
  # bundle for this repo to fetch/pin/update - same pattern siderolabs/extensions' own
  # tailscale.yaml uses for the same problem.
  mounts:
    - source: /etc/ssl/certs
      destination: /etc/ssl/certs
      type: bind
      options:
        - rbind
  security:
    writeableRootfs: false
    writeableSysfs: false
depends:
  - configuration: true
# Perpetual daemon, not one-shot: it never intentionally exits (main.rs's run() only returns once
# the bundled `bird` child process exits, which is always treated as fatal - see main.rs's own
# doc comment). `always` restarts the whole container - both `router` and `bird` fresh - regardless
# of exit reason, matching ext-awg's `restart: always`.
restart: always
logToConsole: true
