[package]
name = "nftables"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Talos extension service: oneshot loader for an nftables ruleset supplied via ExtensionServiceConfig, with {{ placeholder }} substitution for values only knowable on the running node (currently: default-route interface names)"

[[bin]]
name = "nftables"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
common.workspace = true
serde.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
