[package]
name = "nftables"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Talos extension service: loads an nftables ruleset supplied via ExtensionServiceConfig as a template of values only knowable on the running node (currently: default-route interface names), and reapplies it when its tables go missing"

[[bin]]
name = "nftables"
path = "src/main.rs"
# The daemon is netlink-backed; a config-only build of this crate builds the library alone.
required-features = ["runtime"]

[dependencies]
anyhow.workspace = true
common.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["runtime"]
# The netlink-backed modules and the binary over them; `config` builds without any of it.
runtime = ["common/netlink"]
