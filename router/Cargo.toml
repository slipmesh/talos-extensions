[package]
name = "router"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Talos extension service: renders BIRD config (OSPFv3 over mesh links, full-mesh iBGP over loopbacks) and resolves bypass-route prefixes from a static config file, supervising a bundled bird process"

[[bin]]
name = "router"
path = "src/main.rs"
# The daemon is netlink-backed; a config-only build of this crate builds the library alone.
required-features = ["runtime"]

[dependencies]
anyhow.workspace = true
askama.workspace = true
common.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "process", "io-util", "net", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["runtime"]
# The netlink-backed modules and the binary over them; `config` builds without any of it.
runtime = ["common/netlink"]
