timeformat protocol iso long;
log stderr { info, remote, warning, error, auth, fatal, bug };
router id 198.51.100.1;
protocol device {
}
protocol direct direct1 {
    interface "router-lo";
    ipv4 { import all; };
}
protocol direct direct_lan0 {
    interface "lan0";
    ipv4 { import all; };
}
protocol direct direct_mesh__ {
    interface "mesh-*";
    ipv4 { import all; };
}
protocol kernel {
    ipv4 {
        import filter {
            if net ~ [ 203.0.113.128/26+ ] then accept;
            if krt_source = 200 then accept;
            reject;
        };
        export filter {
            if source = RTS_BGP then {
                krt_prefsrc = 198.51.100.1;
                accept;
            }
            if proto = "ANNOUNCE" then {
                krt_prefsrc = 198.51.100.1;
                accept;
            }
            reject;
        };
    };
    learn all;
}
protocol kernel {
    ipv6 {
        export filter {
            if source = RTS_OSPF then accept;
            reject;
        };
    };
}protocol bfd {
    interface "mesh-*" {
        min rx interval 300 ms;
        min tx interval 300 ms;
        multiplier 5;
    };
}
protocol ospf v3 mesh6 {
    ipv6 {
        import all;
        export none;
    };
    area 0 {
        interface "router-lo" { stub yes; };
        interface "mesh-*" { type ptp; bfd on; };
        interface "router-lo" { type ptp; };
    };
}
protocol static BYPASS {
    ipv4 { import all; };
    route 192.0.2.0/24 blackhole; # example
}
protocol static ANNOUNCE {
    ipv4 { import all; };
    route 203.0.113.192/26 via "router-lo"; # 
}
protocol bgp ibgp6_node_b {
    local 3fff::1 as 64512;
    neighbor 3fff::2 as 64512;
    multihop;
    ipv4 {
        extended next hop on;
        import all;
        export filter {
            if source = RTS_DEVICE then accept;
            if source = RTS_STATIC then accept;
            if source = RTS_INHERIT then accept;
            reject;
        };
        next hop self;
    };
}
protocol bgp ibgp6_router1 {
    local 3fff::1 as 64512;
    neighbor 3fff::4 as 64512;
    multihop;
    ipv4 {
        extended next hop on;
        import all;
        export filter {
            if source = RTS_DEVICE then accept;
            if source = RTS_STATIC then accept;
            if source = RTS_INHERIT then accept;
            reject;
        };
        next hop self;
    };
}
