timeformat protocol iso long;
log stderr { info, remote, warning, error, auth, fatal, bug };
router id 10.62.0.1;
protocol device {
}
protocol direct direct1 {
    interface "router-lo";
    ipv4 { import all; };
}
protocol direct direct_cni0 {
    interface "cni0";
    ipv4 { import all; };
}
protocol direct direct__198_51_100_0_24 {
    interface 198.51.100.0/24;
    ipv4 { import all; };
}
protocol kernel {
    ipv4 {
        import filter {
            if net ~ [ 10.61.0.0/16+, 10.99.0.5/32+ ] then accept;
            reject;
        };
        export filter {
            if source = RTS_BGP then {
                krt_prefsrc = 10.62.0.1;
                accept;
            }
            if proto = "ANNOUNCE" then {
                krt_prefsrc = 10.62.0.1;
                accept;
            }
            reject;
        };
    };
    learn all;
}
protocol kernel {
    ipv6 {
        export filter {
            if source = RTS_OSPF then accept;
            reject;
        };
    };
}protocol bfd {
    interface "mesh-*" {
        min rx interval 300 ms;
        min tx interval 300 ms;
        multiplier 5;
    };
    interface 10.99.0.0/24 {
        min rx interval 300 ms;
        min tx interval 300 ms;
        multiplier 5;
    };
}
protocol ospf v3 mesh6 {
    ipv6 {
        import all;
        export none;
    };
    area 0 {
        interface "router-lo" { stub yes; };
        interface "mesh-*" { type ptp; bfd on; };
        interface 10.99.0.0/24 { type ptp; bfd on; };
        interface "router-lo" { type ptp; };
    };
}
protocol static BYPASS {
    ipv4 { import all; };
    route 203.0.113.0/24 blackhole; # AS64500 example
}
protocol static ANNOUNCE {
    ipv4 { import all; };
    route 10.60.0.0/16 via "router-lo"; # k8s-services
}
protocol bgp ibgp6_node_b {
    local fd00::1 as 64512;
    neighbor fd00::2 as 64512;
    multihop;
    ipv4 {
        extended next hop on;
        import all;
        export filter {
            if source = RTS_DEVICE then accept;
            if source = RTS_STATIC then accept;
            if source = RTS_INHERIT then accept;
            reject;
        };
        next hop self;
    };
}
protocol bgp ibgp6__3rd {
    local fd00::1 as 64512;
    neighbor fd00::3 as 64512;
    multihop;
    ipv4 {
        extended next hop on;
        import all;
        export filter {
            if source = RTS_DEVICE then accept;
            if source = RTS_STATIC then accept;
            if source = RTS_INHERIT then accept;
            reject;
        };
        next hop self;
    };
}