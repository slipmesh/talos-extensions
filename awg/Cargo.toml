[package]
name = "awg"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Talos extension service: converges AmneziaWG interfaces (mesh links and/or road-warrior peers) from a static config file, tracks handshakes and installs kernel routes for explicitly-addressed peers"

[[bin]]
name = "awg"
path = "src/main.rs"
# The daemon is netlink-backed; a config-only build of this crate builds the library alone.
required-features = ["runtime"]

[dependencies]
anyhow.workspace = true
common.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
netlink-packet-amneziawg = { workspace = true, optional = true }
netlink-packet-core = { workspace = true, optional = true }
prometheus-client.workspace = true
rtnetlink = { workspace = true, optional = true }
serde.workspace = true
sliplib-secrets.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
sliplib-runtime.workspace = true
yaml_serde.workspace = true

[features]
default = ["runtime"]
# Everything but `config`: the modules that talk netlink, and the binary over them.
runtime = [
    "common/netlink",
    "dep:netlink-packet-amneziawg",
    "dep:netlink-packet-core",
    "dep:rtnetlink",
]
