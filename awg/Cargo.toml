[package]
name = "awg"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Talos extension service: converges AmneziaWG interfaces (mesh links and/or road-warrior peers) from a static config file, tracks handshakes and installs kernel routes for explicitly-addressed peers"

[[bin]]
name = "awg"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
common = { workspace = true, features = ["netlink"] }
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
netlink-packet-amneziawg.workspace = true
netlink-packet-core.workspace = true
prometheus-client.workspace = true
sliplib-config.workspace = true
sliplib-net.workspace = true
sliplib-secrets.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
sliplib-runtime.workspace = true
sliplib-yaml.workspace = true
