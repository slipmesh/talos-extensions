[package]
name = "awg"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Talos extension service: converges AmneziaWG interfaces (mesh links and/or road-warrior peers) from a static config file, tracks handshakes and installs kernel routes for explicitly-addressed peers"

[[bin]]
name = "awg"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
common.workspace = true
netlink-packet-amnezia-wireguard.workspace = true
netlink-packet-core.workspace = true
rtnetlink.workspace = true
serde.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
