# Netlink I/O is a thin shim that only a node exercises (see the README's Development section): no
# unit test can tell a call to the kernel from none, so its mutants would only ever be missed.
exclude_globs = ["common/src/netlink/**"]
# `report_defaults` only prints what `generate` did, and the console text is not tested.
exclude_re = ["ensure_interface", "report_defaults"]
