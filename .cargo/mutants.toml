# Netlink I/O is a thin shim that only a node and the ignored netns tests exercise (see the README's
# Development section), and mutants runs no ignored test, so its mutants would only ever be missed.
exclude_globs = ["common/src/netlink/**"]
exclude_re = [
    "ensure_interface",
    # One `get_device` call over the fold `awg/src/dump.rs` tests.
    "replace current_peers ",
    "replace dump_peers ",
    # The `rt` calls over the route plan its tests pin.
    "replace reconcile_pass with \\(\\)",
    # Its own socket: the connect, a drop mid-scrape, the dump timeout.
    "metrics.rs:.*replace collect -> Dumps with Default::default\\(\\)",
    # Its only effect is one log line at start.
    "replace log_handshake_summary with \\(\\)",
    # Netlink only, as `ensure_interface`.
    "replace ensure_loopback ",
    # Wording of a refusal: what a visitor expects.
    "Visitor<.*>::expecting",
    # Only the fixed `/run/bird.ctl`.
    "replace force_reconfigure ",
    # Only the fixed `/run/bird/bird.conf` and socket; `bird::reconcile` is tested with its own.
    "router/src/main.rs:.*replace reconcile ",
    # The system clock; every reader takes the time as an argument.
    "replace now_unix ",
    # Spawns `nft monitor` and runs forever.
    "nftables/src/main.rs:.*replace watchdog ",
    # Runs `nft`, which needs the node's netlink.
    "nftables/src/ruleset.rs:.*replace apply ",
    # An HTTPS request to RIPEstat.
    "replace ripestat_get ",
]
