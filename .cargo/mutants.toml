# Netlink I/O is a thin shim that only a node exercises (see the README's Development section): no
# unit test can tell a call to the kernel from none, so its mutants would only ever be missed.
exclude_globs = ["common/src/netlink/**"]
exclude_re = [
    "ensure_interface",
    # One `get_device` call over the fold `awg/src/dump.rs` tests.
    "replace current_peers ",
    "replace dump_peers ",
    # The `rt` calls over the route plan its tests pin.
    "replace reconcile_pass with \\(\\)",
    # Its own socket: the connect, a drop mid-scrape, the dump timeout.
    "metrics.rs:.*replace collect -> Dumps with Default::default\\(\\)",
    # Its only effect is one log line at start.
    "replace log_handshake_summary with \\(\\)",
]
